<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 536" role="img" aria-labelledby="t d">
<title id="t">Evidence map: population group by direction of result, with overall risk of bias</title>
<desc id="d">Evidence map of 6 included studies by population group (rows) and direction of the between-group result (columns), one mark per study showing its overall risk-of-bias rating. Cell counts: adults × other: 1 (oa-W7220097264 High); adults × favours exergame: 2 (pm-41307454 High, pm-42974341 High); adults × mixed across subscales: 1 (pm-41628428 Some concerns); older adults × other: 1 (pm-40567995 Some concerns); older adults × favours exergame: 0; older adults × mixed across subscales: 0; children and adolescents × other: 1 (pm-43021294 High); children and adolescents × favours exergame: 0; children and adolescents × mixed across subscales: 0. Overall risk of bias: 4 High, 2 Some concerns. Eligibility kept marked doubtful by the user: oa-W7220097264. Direction codes come from each trial's own between-group test and are not effect sizes; 'other' means only a total or composite score of unstated construction or valence was reported, so no direction is coded (amendment A11).</desc>
<style>
.lab{font:13px system-ui,sans-serif;fill:#5a6478}.hd{font:600 13px system-ui,sans-serif;fill:#5a6478}
.ttl{font:600 15px system-ui,sans-serif;fill:#5a6478}.sm{font:12px system-ui,sans-serif;fill:#6b7488}
.let{font:700 14px system-ui,sans-serif;fill:#1f2633}.grid{stroke:#8a93a6;stroke-width:1;fill:none}
.dash{stroke:#5a6478;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
@media (prefers-color-scheme: dark){.lab,.hd,.ttl{fill:#c3cad8}.sm{fill:#aab2c2}.dash{stroke:#c3cad8}}
</style>
