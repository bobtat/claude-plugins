<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 552" role="img" aria-labelledby="ttl dsc">
<title id="ttl">PRISMA 2020 flow diagram</title>
<desc id="dsc">PRISMA 2020 flow. 189 records identified from databases and registers and 10 from other methods; 140 screened; 6 studies included.</desc>
<style>.bx{fill:none;stroke:#44506b;stroke-width:1.2}.t{font:11.5px system-ui,-apple-system,Segoe UI,sans-serif;fill:#44506b}.hd{font:600 12px system-ui,sans-serif;fill:#44506b}.bandbx{fill:none;stroke:#6b7488;stroke-width:1}.band{font:600 11px system-ui,sans-serif;fill:#6b7488}.ar{stroke:#44506b;stroke-width:1.2;fill:none;marker-end:url(#a)}.fn{font:11px system-ui,sans-serif;fill:#6b7488}@media (prefers-color-scheme: dark){.bx{stroke:#9fb0d0}.t,.hd{fill:#9fb0d0}.bandbx{stroke:#8f9ab4}.band,.fn{fill:#8f9ab4}.ar{stroke:#9fb0d0}#ah{fill:#9fb0d0}}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path id="ah" d="M0 0 L8 4 L0 8 z" fill="#44506b"/></marker></defs>
