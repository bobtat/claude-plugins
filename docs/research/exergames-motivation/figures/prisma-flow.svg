<rect class="bandbx" x="10" y="432" width="26" height="46" rx="2"/>
<text class="band" x="23" y="455" text-anchor="middle" transform="rotate(-90 23 455)">Included</text>
<path class="ar" d="M179 122 L179 152"/>
