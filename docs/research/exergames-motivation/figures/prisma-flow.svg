<rect class="bx" x="54" y="62" width="250" height="60" rx="2"/><text class="t" x="63" y="82.5">Records identified from*:</text><text class="t" x="63" y="96.5">  PubMed (n = 83)</text><text class="t" x="63" y="110.5">  OpenAlex (n = 106)</text>
<rect class="bx" x="336" y="62" width="250" height="46" rx="2"/><text class="t" x="345" y="82.5">Records removed before screening:</text><text class="t" x="345" y="96.5">  Duplicate records removed (n = 49)</text>
<rect class="bx" x="628" y="62" width="250" height="46" rx="2"/><text class="t" x="637" y="82.5">Records identified from:</text><text class="t" x="637" y="96.5">  Citation searching (backward) (n = 10)</text>
<rect class="bx" x="54" y="152" width="250" height="32" rx="2"/><text class="t" x="63" y="172.5">Records screened (n = 140)</text>
<rect class="bx" x="336" y="152" width="250" height="60" rx="2"/><text class="t" x="345" y="172.5">Records excluded**:</text><text class="t" x="345" y="186.5">  by automation tools (n = 80)</text><text class="t" x="345" y="200.5">  by a human reviewer (n = 0)</text>
<rect class="bx" x="54" y="238" width="250" height="32" rx="2"/><text class="t" x="63" y="258.5">Reports sought for retrieval (n = 60)</text>
<rect class="bx" x="336" y="238" width="250" height="32" rx="2"/><text class="t" x="345" y="258.5">Reports not retrieved (n = 20)</text>
<rect class="bx" x="54" y="296" width="250" height="32" rx="2"/><text class="t" x="63" y="316.5">Reports assessed for eligibility (n = 40)</text>
<rect class="bx" x="336" y="296" width="250" height="102" rx="2"/><text class="t" x="345" y="316.5">Reports excluded:</text><text class="t" x="345" y="330.5">  E5: No named motivation instrument (n = 22)</text><text class="t" x="345" y="344.5">  E1: Not an exergame (n = 8)</text><text class="t" x="345" y="358.5">  E4: Under two weeks (n = 2)</text><text class="t" x="345" y="372.5">  E6: No motivation results by arm (n = 1)</text><text class="t" x="345" y="386.5">  E9: Not a primary report (n = 1)</text>
<rect class="bx" x="628" y="238" width="250" height="32" rx="2"/><text class="t" x="637" y="258.5">Reports sought for retrieval (n = 5)</text>
<rect class="bx" x="910" y="238" width="250" height="32" rx="2"/><text class="t" x="919" y="258.5">Reports not retrieved (n = 1)</text>
<rect class="bx" x="628" y="296" width="250" height="32" rx="2"/><text class="t" x="637" y="316.5">Reports assessed for eligibility (n = 4)</text>
<rect class="bx" x="910" y="296" width="250" height="60" rx="2"/><text class="t" x="919" y="316.5">Reports excluded:</text><text class="t" x="919" y="330.5">  E4: Under two weeks (n = 2)</text><text class="t" x="919" y="344.5">  E5: No named motivation instrument (n = 2)</text>
<rect class="bx" x="54" y="432" width="310" height="46" rx="2"/><text class="t" x="63" y="452.5">Studies included in review (n = 6)</text><text class="t" x="63" y="466.5">Reports of included studies (n = 6)</text>
<text class="fn" x="54" y="504">* Consider, if feasible, reporting the number of records identified from each database or register searched,</text>
<text class="fn" x="54" y="517">rather than the total across all of them.</text>
<text class="fn" x="54" y="530">** If automation tools were used, indicate how many records were excluded by a human and how many were</text>
<text class="fn" x="54" y="543">excluded by automation tools.</text>
