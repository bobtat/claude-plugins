<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 448" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Risk-of-bias summary (RoB 2), n=6 studies</title>
<desc id="figDesc">Risk-of-bias summary, RoB 2, 6 studies. D1 Randomization process: 0 Low, 5 Some concerns, 1 High. D2 Deviations from intended interventions: 0 Low, 5 Some concerns, 1 High. D3 Missing outcome data: 0 Low, 3 Some concerns, 3 High. D4 Measurement of the outcome: 0 Low, 5 Some concerns, 1 High. D5 Selection of the reported result: 0 Low, 6 Some concerns, 0 High. Overall: 0 Low, 2 Some concerns, 4 High. Overall is derived as the worst domain judgment per study.</desc>
<style>
.lab{font:13px system-ui,sans-serif;fill:#5a6478}
.ttl{font:600 15px system-ui,sans-serif;fill:#5a6478}
.seg{font:600 13px system-ui,sans-serif;fill:#1b1f27}
.small{font:12px system-ui,sans-serif;fill:#5a6478}
.ax{stroke:#8a94a8;stroke-width:1;fill:none}
.sep{stroke:#8a94a8;stroke-width:1;stroke-dasharray:4 3;fill:none}
@media (prefers-color-scheme: dark){.lab,.ttl,.small{fill:#b4bfd4}.ax,.sep{stroke:#8f9ab0}}
</style>
<text class="ttl" x="12" y="28">Risk of bias by domain, RoB 2 (n=6 studies)</text>
<text class="small" x="12" y="48">Each bar counts the studies at each judgment; segment labels give the letter and the study count.</text>
<text class="lab" x="12" y="92.5">D1 Randomization process</text>
