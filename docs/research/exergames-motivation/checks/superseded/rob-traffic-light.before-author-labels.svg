<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 544" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Risk-of-bias traffic-light plot (RoB 2), by study and domain</title>
<desc id="figDesc">Risk of bias (RoB 2) for 6 studies across five domains and an overall judgment. Counts per domain — D1 Randomization process: 0 low, 5 some concerns, 1 high; D2 Deviations from intended interventions: 0 low, 5 some concerns, 1 high; D3 Missing outcome data: 0 low, 3 some concerns, 3 high; D4 Measurement of the outcome: 0 low, 5 some concerns, 1 high; D5 Selection of the reported result: 0 low, 6 some concerns, 0 high; Overall: 0 low, 2 some concerns, 4 high. No study was rated low risk in any domain. Overall is derived as the worst domain judgment. 3 cells were adjudicated: pm-40567995 D5, pm-41628428 D1, pm-43021294 D5. Per study, oa-W7220097264: D1 S, D2 S, D3 S, D4 H, D5 S, Overall H; pm-40567995: D1 S, D2 S, D3 S, D4 S, D5 S, Overall S; pm-41307454: D1 S, D2 S, D3 H, D4 S, D5 S, Overall H; pm-41628428: D1 S, D2 S, D3 S, D4 S, D5 S, Overall S; pm-42974341: D1 H, D2 S, D3 H, D4 S, D5 S, Overall H; pm-43021294: D1 S, D2 H, D3 H, D4 S, D5 S, Overall H.</desc>
