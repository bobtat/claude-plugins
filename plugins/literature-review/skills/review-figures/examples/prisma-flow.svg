<text class="band" x="23" y="282" text-anchor="middle" transform="rotate(-90 23 282)">Screening</text>
<rect class="bandbx" x="10" y="418" width="26" height="46" rx="2"/>
<text class="band" x="23" y="441" text-anchor="middle" transform="rotate(-90 23 441)">Included</text>
<path class="ar" d="M179 136 L179 166"/>
<path class="ar" d="M304 99 L336 99"/>
