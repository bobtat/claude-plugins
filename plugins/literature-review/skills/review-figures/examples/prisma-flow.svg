<rect class="bx" x="54" y="62" width="250" height="74" rx="2"/><text class="t" x="63" y="82.5">Records identified from*:</text><text class="t" x="63" y="96.5">  PubMed (n = 84)</text><text class="t" x="63" y="110.5">  arXiv (n = 41)</text><text class="t" x="63" y="124.5">  OpenAlex (n = 17)</text>
<rect class="bx" x="336" y="62" width="250" height="46" rx="2"/><text class="t" x="345" y="82.5">Records removed before screening:</text><text class="t" x="345" y="96.5">  Duplicate records removed (n = 31)</text>
<rect class="bx" x="628" y="62" width="250" height="46" rx="2"/><text class="t" x="637" y="82.5">Records identified from:</text><text class="t" x="637" y="96.5">  Citation searching (n = 12)</text>
<rect class="bx" x="54" y="166" width="250" height="32" rx="2"/><text class="t" x="63" y="186.5">Records screened (n = 111)</text>
<rect class="bx" x="336" y="166" width="250" height="60" rx="2"/><text class="t" x="345" y="186.5">Records excluded**:</text><text class="t" x="345" y="200.5">  by automation tools (n = 54)</text><text class="t" x="345" y="214.5">  by a human reviewer (n = 24)</text>
<rect class="bx" x="54" y="252" width="250" height="32" rx="2"/><text class="t" x="63" y="272.5">Reports sought for retrieval (n = 33)</text>
<rect class="bx" x="336" y="252" width="250" height="32" rx="2"/><text class="t" x="345" y="272.5">Reports not retrieved (n = 2)</text>
<rect class="bx" x="54" y="310" width="250" height="32" rx="2"/><text class="t" x="63" y="330.5">Reports assessed for eligibility (n = 31)</text>
<rect class="bx" x="336" y="310" width="250" height="74" rx="2"/><text class="t" x="345" y="330.5">Reports excluded:</text><text class="t" x="345" y="344.5">  Wrong population (n = 5)</text><text class="t" x="345" y="358.5">  Not primary research (n = 3)</text><text class="t" x="345" y="372.5">  No extractable outcome (n = 1)</text>
<rect class="bx" x="628" y="252" width="250" height="32" rx="2"/><text class="t" x="637" y="272.5">Reports sought for retrieval (n = 12)</text>
<rect class="bx" x="910" y="252" width="250" height="32" rx="2"/><text class="t" x="919" y="272.5">Reports not retrieved (n = 1)</text>
<rect class="bx" x="628" y="310" width="250" height="32" rx="2"/><text class="t" x="637" y="330.5">Reports assessed for eligibility (n = 11)</text>
<rect class="bx" x="910" y="310" width="250" height="60" rx="2"/><text class="t" x="919" y="330.5">Reports excluded:</text><text class="t" x="919" y="344.5">  Wrong population (n = 2)</text><text class="t" x="919" y="358.5">  Duplicate of included report (n = 1)</text>
<rect class="bx" x="54" y="418" width="310" height="46" rx="2"/><text class="t" x="63" y="438.5">Studies included in review (n = 30)</text><text class="t" x="63" y="452.5">Reports of included studies (n = 33)</text>
<text class="fn" x="54" y="490">* Consider, if feasible, reporting the number of records identified from each database or register searched,</text>
<text class="fn" x="54" y="503">rather than the total across all of them.</text>
<text class="fn" x="54" y="516">** If automation tools were used, indicate how many records were excluded by a human and how many were</text>
<text class="fn" x="54" y="529">excluded by automation tools.</text>
</svg>